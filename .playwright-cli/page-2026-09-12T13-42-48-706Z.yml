                      - generic [ref=f13e114]: "# ============================================================ # HYBRID POSTPROCESSING # # Порядок: # clean ILP graph # -> one-frame gap closing # -> short-track filtering # -> submission_clean.csv # # Следующая ячейка добавит hub и fake forks. # ============================================================ from pathlib import Path from scipy.optimize import linear_sum_assignment from scipy.spatial.distance import cdist import numpy as np import pandas as pd import zarr RAW_SUBMISSION_PATH = \"submission.csv\" CLEAN_SUBMISSION_PATH = \"submission_clean.csv\" # Физический размер исходного вокселя: # координаты расположены в порядке z, y, x. VOXEL_SIZE_UM = np.asarray( [1.625, 0.40625, 0.40625], dtype=np.float64, ) # ------------------------------------------------------------ # Настройки one-frame gap closing # ------------------------------------------------------------ GAP_CLOSE_MAX_TOTAL_UM = 10.0 # Сначала пытаемся использовать уже существующую # изолированную детекцию на пропущенном кадре. GAP_REUSE_EXISTING_UM = 2.5 # Ограничиваем число закрываемых разрывов. GAP_MAX_ADDED_FRAC = 0.05 GAP_MAX_ADDED_ABS = 1000 # Уточнение синтетической точки по изображению. GAP_REFINE_WIN_Z = 1 GAP_REFINE_WIN_YX = 4 GAP_REFINE_MAX_SHIFT_UM = 2.5 # ------------------------------------------------------------ # Настройки фильтрации коротких треков # ------------------------------------------------------------ MIN_TRACK_LEN = 3 # Короткие компоненты с делением сохраняются. KEEP_DIVISION_COMPONENTS = True # Сохраняем компоненты, обрезанные началом или концом видео. KEEP_BOUNDARY_COMPONENTS = True BOUNDARY_MARGIN_T = 2 def open_image_array(dataset): \"\"\" Открыть Zarr-массив изображения формы (T, Z, Y, X). \"\"\" zarr_path = Path(valid_dir) / f\"{dataset}.zarr\" if not zarr_path.exists(): raise FileNotFoundError( f\"Не найден файл изображения: {zarr_path}\" ) root = zarr.open( str(zarr_path), mode=\"r\", ) # Иногда корень сам является массивом. if ( hasattr(root, \"shape\") and len(root.shape) == 4 ): return root # В данных соревнования массив обычно находится по пути \"0\". return root[\"0\"] def distance_um(point_a, point_b): \"\"\" Физическое расстояние между координатами z,y,x. \"\"\" point_a = np.asarray( point_a, dtype=np.float64, ) point_b = np.asarray( point_b, dtype=np.float64, ) return float( np.linalg.norm( (point_a - point_b) * VOXEL_SIZE_UM ) ) def refine_synthetic_node( frame, midpoint, ): \"\"\" Немного передвинуть синтетическую точку от геометрической середины к локальному центру яркости изображения. frame имеет форму (Z, Y, X). midpoint имеет порядок (z, y, x). \"\"\" midpoint = np.asarray( midpoint, dtype=np.float64, ) center = np.rint( midpoint ).astype(int) z, y, x = center.tolist() z0 = max( 0, z - GAP_REFINE_WIN_Z, ) z1 = min( frame.shape[0], z + GAP_REFINE_WIN_Z + 1, ) y0 = max( 0, y - GAP_REFINE_WIN_YX, ) y1 = min( frame.shape[1], y + GAP_REFINE_WIN_YX + 1, ) x0 = max( 0, x - GAP_REFINE_WIN_YX, ) x1 = min( frame.shape[2], x + GAP_REFINE_WIN_YX + 1, ) patch = np.asarray( frame[ z0:z1, y0:y1, x0:x1, ], dtype=np.float64, ) if patch.size == 0: return midpoint background = float( np.percentile( patch, 20, ) ) weights = np.maximum( patch - background, 0, ) weight_sum = float( weights.sum() ) if ( not np.isfinite(weight_sum) or weight_sum <= 0 ): return midpoint zz = np.arange( z0, z1, dtype=np.float64, )[:, None, None] yy = np.arange( y0, y1, dtype=np.float64, )[None, :, None] xx = np.arange( x0, x1, dtype=np.float64, )[None, None, :] refined = np.asarray( [ float( (weights * zz).sum() / weight_sum ), float( (weights * yy).sum() / weight_sum ), float( (weights * xx).sum() / weight_sum ), ], dtype=np.float64, ) shift_um = distance_um( midpoint, refined, ) # Если локальная яркость увела точку слишком далеко, # оставляем безопасную геометрическую середину. if ( not np.isfinite(shift_um) or shift_um > GAP_REFINE_MAX_SHIFT_UM ): return midpoint return refined def build_degrees( node_ids, edges, ): \"\"\" Посчитать входящую и исходящую степени. \"\"\" in_degree = { int(node_id): 0 for node_id in node_ids } out_degree = { int(node_id): 0 for node_id in node_ids } for source_id, target_id in edges: source_id = int(source_id) target_id = int(target_id) if source_id in out_degree: out_degree[source_id] += 1 if target_id in in_degree: in_degree[target_id] += 1 return in_degree, out_degree def find_components( node_ids, edges, ): \"\"\" Weakly connected components через union-find. Направление рёбер временно игнорируется. \"\"\" node_ids = [ int(node_id) for node_id in node_ids ] parent = { node_id: node_id for node_id in node_ids } rank = { node_id: 0 for node_id in node_ids } def find(node_id): while parent[node_id] != node_id: parent[node_id] = parent[ parent[node_id] ] node_id = parent[node_id] return node_id def union(node_a, node_b): root_a = find(node_a) root_b = find(node_b) if root_a == root_b: return if rank[root_a] < rank[root_b]: parent[root_a] = root_b elif rank[root_a] > rank[root_b]: parent[root_b] = root_a else: parent[root_b] = root_a rank[root_a] += 1 for source_id, target_id in edges: source_id = int(source_id) target_id = int(target_id) if ( source_id in parent and target_id in parent ): union( source_id, target_id, ) components = {} for node_id in node_ids: root = find(node_id) components.setdefault( root, [], ).append(node_id) return list( components.values() ) def postprocess_one_dataset( group, ): \"\"\" 1. Закрыть разрывы длиной ровно один кадр. 2. Удалить оставшиеся короткие компоненты. \"\"\" dataset = str( group[\"dataset\"].iloc[0] ) image_array = open_image_array( dataset ) T, Z, Y, X = map( int, image_array.shape, ) node_frame = ( group[ group[\"row_type\"] == \"node\" ][ [ \"node_id\", \"t\", \"z\", \"y\", \"x\", ] ] .copy() ) edge_frame = ( group[ group[\"row_type\"] == \"edge\" ][ [ \"source_id\", \"target_id\", ] ] .copy() ) nodes = {} for row_data in node_frame.itertuples( index=False ): node_id = int( row_data.node_i